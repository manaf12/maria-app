<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Correct favicon path (must be in /public) -->
    <link rel="icon" type="image/svg+xml" href="src/assets/Icon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Taxero.ch</title>

    <!-- French SEO Meta Description -->
    <meta 
      name="description" 
      content="Déclarez vos impôts suisses en ligne en toute sécurité avec Taxero. Simple, rapide et adapté à votre situation. Accessible à tous les clients en Suisse."
    />

    <!-- Optional: Keywords (not required but harmless) -->
    <meta 
      name="keywords" 
      content="déclaration d’impôts suisse, impôts en ligne, taxero, fiscalité suisse, remplir impôts suisse, déclaration d’impôts fribourg, service fiscal suisse"
    />

    <!-- OpenGraph (Social Preview) -->
    <meta property="og:title" content="Taxero.ch – Déclaration d’impôts suisse en ligne" />
    <meta property="og:description" content="Déclarez vos impôts suisses en ligne en toute sécurité avec Taxero. Simple, rapide et adapté à votre situation." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://www.taxero.ch/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
